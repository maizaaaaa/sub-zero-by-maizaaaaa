<style>
:root {
  --bg-main: #FFFFFF;
  --bg-subtle: #F4F4F5;
  --bg-surface: #FAFAFA;
  --ink: #09090B;
  --ink-muted: #71717A;
  --accent: #FF5500;
  --accent-hover: #E04B00;
  --border: #E4E4E7;
  --border-dark: #09090B;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-main);
  color: var(--ink);
}

.f-display { font-family: 'Anton', sans-serif; }
.f-mono { font-family: 'JetBrains Mono', monospace; }

.product-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  transition: transform 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
}
.product-card:hover { 
  transform: translateY(-4px); 
  border-color: var(--border-dark);
}

.btn-buy { background: var(--accent); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
.btn-buy:hover { background: var(--accent-hover); }

.btn-add { 
  border: 1.5px solid var(--ink); 
  color: var(--ink); 
  background: transparent; 
}
.btn-add:hover { 
  background: var(--ink); 
  color: #fff; 
}

/* Modal HUD Frame Styling */
.hud-frame { position: relative; }
.hud-frame::before, .hud-frame::after {
  content: ''; position: absolute; width: 16px; height: 16px;
  border-style: solid; border-color: var(--accent); border-width: 0;
  pointer-events: none;
}
.hud-frame::before { top: -1px; left: -1px; border-top-width: 3px; border-left-width: 3px; }
.hud-frame::after { bottom: -1px; right: -1px; border-bottom-width: 3px; border-right-width: 3px; }

/* Modal Display */
#product-modal.hidden { display: none; }

/* Cart Drawer */
#cart-overlay { position: fixed; inset: 0; background: rgba(9,9,11,0.6); backdrop-filter: blur(2px); z-index: 60; display: none; }
#cart-drawer {
  position: fixed; top: 0; right: 0; height: 100%; width: min(400px, 90vw);
  background: var(--bg-main); border-left: 1px solid var(--border-dark); z-index: 70;
  transform: translateX(100%); transition: transform 0.3s ease-in-out;
  display: flex; flex-direction: column;
}
#cart-drawer.open { transform: translateX(0); }
</style>

var cart = [];
var activeProduct = null; // Explicitly declared

try {
  var stored = localStorage.getItem('subzero_cart');
  if (stored) {
    cart = JSON.parse(stored);
  }
} catch (e) {
  cart = [];
}

function saveCart() {
  localStorage.setItem('subzero_cart', JSON.stringify(cart));
  updateCartUI();
}

function addToCart(product) {
  var existing = null;
  for (var i = 0; i < cart.length; i++) {
    if (cart[i].id === product.id) {
      existing = cart[i];
      break;
    }
  }

  if (existing) {
    existing.qty = (parseInt(existing.qty) || 0) + 1;
  } else {
    cart.push({
      id: product.id,
      name: product.name,
      category: product.category,
      price: parseFloat(product.price) || 0,
      icon: product.icon,
      image: product.image,
      qty: 1
    });
  }
  saveCart();
  toggleCart(true);
}

function updateQty(id, delta) {
  for (var i = 0; i < cart.length; i++) {
    if (cart[i].id === id || !cart[i].id) {
      cart[i].qty = (parseInt(cart[i].qty) || 0) + delta;
      if (cart[i].qty <= 0 || !cart[i].id) {
        cart.splice(i, 1);
        i--;
      }
      break;
    }
  }
  saveCart();
}

function updateCartUI() {
  var container = document.getElementById('cart-items-container');
  var badge = document.getElementById('cart-badge');
  var subtotalEl = document.getElementById('cart-subtotal');
  
  var totalCount = 0;
  var subtotal = 0;

  for (var i = 0; i < cart.length; i++) {
    var itemQty = parseInt(cart[i].qty) || 0;
    var itemPrice = parseFloat(cart[i].price) || 0;

    totalCount += itemQty;
    subtotal += (itemPrice * itemQty);
  }
  
  badge.innerText = totalCount;
  subtotalEl.innerText = 'Rs. ' + subtotal.toLocaleString(); // Updated to Rs.

  if (cart.length === 0) {
    container.innerHTML = '<p class="text-center text-xs text-[var(--ink-muted)] f-mono uppercase mt-8">Cart manifest empty.</p>';
    return;
  }

  var html = '';
  for (var j = 0; j < cart.length; j++) {
    var c = cart[j];
    var p = parseFloat(c.price) || 0;
    var q = parseInt(c.qty) || 0;

    // Render image thumbnail inside drawer if available
    var imgHTML = c.image 
      ? '<img src="' + c.image + '" alt="' + c.name + '" class="w-full h-full object-cover">'
      : '<i class="fa-solid ' + c.icon + '"></i>';

    html += '<div class="flex items-center gap-3 p-3 bg-[var(--bg-surface)] border border-[var(--border)]">' +
      '<div class="w-10 h-10 bg-[var(--bg-subtle)] border border-[var(--border)] flex items-center justify-center text-sm overflow-hidden shrink-0">' +
        imgHTML +
      '</div>' +
      '<div class="flex-1 min-w-0">' +
        '<h4 class="f-display text-sm uppercase truncate">' + c.name + '</h4>' +
        '<p class="f-mono text-xs text-[var(--accent)] font-bold">Rs. ' + p.toLocaleString() + '</p>' +
      '</div>' +
      '<div class="flex items-center border border-[var(--border)] bg-[var(--bg-main)]">' +
        '<button onclick="updateQty(\'' + c.id + '\', -1)" class="px-2 py-0.5 text-xs">-</button>' +
        '<span class="px-2 f-mono text-xs font-bold">' + q + '</span>' +
        '<button onclick="updateQty(\'' + c.id + '\', 1)" class="px-2 py-0.5 text-xs">+</button>' +
      '</div>' +
    '</div>';
  }
  container.innerHTML = html;
}

function toggleCart(open) {
  var drawer = document.getElementById('cart-drawer');
  var overlay = document.getElementById('cart-overlay');
  if (open) {
    drawer.classList.add('open');
    overlay.style.display = 'block';
  } else {
    drawer.classList.remove('open');
    overlay.style.display = 'none';
  }
}

function renderProducts() {
  var grid = document.getElementById('product-grid');
  var html = '';

  for (var i = 0; i < PRODUCTS.length; i++) {
    var p = PRODUCTS[i];
    html += '<div class="product-card p-4 rounded flex flex-col justify-between" onclick="openModal(\'' + p.id + '\')">' +
      '<div>' +
        '<div class="aspect-square bg-[var(--bg-subtle)] flex items-center justify-center mb-4 overflow-hidden rounded">' +
          '<img src="' + p.image + '" alt="' + p.name + '" class="w-full h-full object-cover">' +
        '</div>' +
        '<span class="f-mono text-[10px] text-[var(--accent)] uppercase font-bold tracking-wider">' + p.category + '</span>' +
        '<h3 class="f-display text-xl uppercase mt-1">' + p.name + '</h3>' +
        '<p class="text-xs text-[var(--ink-muted)] my-2">' + p.desc + '</p>' +
      '</div>' +
      '<div class="mt-4 flex items-center justify-between border-t border-[var(--border)] pt-3">' +
        '<span class="f-mono font-bold text-sm">Rs. ' + p.price.toLocaleString() + '</span>' +
        '<span class="btn-buy px-3 py-1.5 text-xs f-mono font-bold uppercase tracking-wider">Inspect</span>' +
      '</div>' +
    '</div>';
  }
  grid.innerHTML = html;
}

function openModal(id) {
  for (var i = 0; i < PRODUCTS.length; i++) {
    if (PRODUCTS[i].id === id) {
      activeProduct = PRODUCTS[i];
      break;
    }
  }
  if (!activeProduct) return;

  document.getElementById('modal-product-name').innerText = activeProduct.name;
  document.getElementById('modal-product-price').innerText = 'Rs. ' + activeProduct.price.toLocaleString();
  document.getElementById('modal-product-desc').innerText = activeProduct.desc;
  document.getElementById('modal-category-badge').innerText = activeProduct.category;
  document.getElementById('modal-product-img').src = activeProduct.image;

  document.getElementById('product-modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('product-modal').classList.add('hidden');
}

document.getElementById('modal-add-cart').addEventListener('click', function() {
  if (activeProduct) {
    addToCart(activeProduct);
    closeModal();
  }
});

document.getElementById('modal-buy-now').addEventListener('click', function() {
  if (activeProduct) {
    addToCart(activeProduct);
    window.location.href = 'checkout.html';
  }
});

window.onload = function() {
  renderProducts();
  updateCartUI();
};
</script>
