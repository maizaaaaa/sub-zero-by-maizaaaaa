<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUB—ZERO | Secure Checkout</title>
<link rel="icon" type="image/png" href="U.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>

<style>
:root {
  /* Dark Monochromatic Cyber-Industrial Tokens */
  --bg-main: #09090B;
  --bg-subtle: #18181B;
  --bg-surface: #131316;
  --ink: #FFFFFF;
  --ink-muted: #A1A1AA;
  --accent: #FF5500;
  --accent-hover: #E04B00;
  --border: #27272A;
  --border-dark: #3F3F46;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-main);
  color: var(--ink);
}

.f-display { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
.f-mono { font-family: 'JetBrains Mono', monospace; }

.hud-frame { position: relative; }
.hud-frame::before, .hud-frame::after {
  content: ''; position: absolute; width: 14px; height: 14px;
  border-style: solid; border-color: var(--accent); border-width: 0;
  pointer-events: none;
}
.hud-frame::before { top: -1px; left: -1px; border-top-width: 3px; border-left-width: 3px; }
.hud-frame::after { bottom: -1px; right: -1px; border-bottom-width: 3px; border-right-width: 3px; }

.btn-buy { background: var(--accent); color: #09090B; transition: background 0.2s; }
.btn-buy:hover { background: var(--accent-hover); }

.checkout-input {
  background: var(--bg-main);
  border: 1px solid var(--border);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  padding: 0.75rem 1rem;
  width: 100%;
  transition: border-color 0.2s ease;
}
.checkout-input:focus {
  outline: none;
  border-color: var(--accent);
}
.checkout-input::placeholder { color: var(--border-dark); }

.payment-option {
  border: 1px solid var(--border);
  background: var(--bg-main);
  transition: border-color 0.2s ease, background 0.2s ease;
  cursor: pointer;
}
.payment-option.selected {
  border-color: var(--accent);
  background: var(--bg-subtle);
}
</style>
</head>
<body class="pt-24 pb-16">

<!-- NAVBAR -->
<nav class="fixed top-0 left-0 right-0 z-40 bg-[var(--bg-main)] border-b border-[var(--border)]">
  <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
    <a href="index.html" class="f-display text-2xl text-[var(--ink)]">SUB<span class="text-[var(--accent)]">—</span>ZERO</a>
    <a href="product.html" class="f-mono text-xs uppercase text-[var(--ink-muted)] hover:text-[var(--accent)] flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Return to Catalog
    </a>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
  <div class="mb-8">
    <span class="f-mono text-xs text-[var(--accent)] font-bold uppercase tracking-widest">// SECURE DISPATCH PROTOCOL</span>
    <h1 class="f-display text-4xl sm:text-5xl uppercase mt-1">Checkout</h1>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
    
    <!-- LEFT COLUMN: FORM -->
    <div class="lg:col-span-7 space-y-8">
      
      <!-- 1. SHIPPING ADDRESS -->
      <section class="bg-[var(--bg-surface)] border border-[var(--border)] p-6 hud-frame">
        <h2 class="f-display text-xl uppercase mb-4 flex items-center gap-2">
          <span class="bg-[var(--ink)] text-[var(--bg-main)] f-mono text-xs px-2 py-0.5">01</span> Shipping Destination
        </h2>

        <form id="checkout-form" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">First Name *</label>
              <input type="text" id="fname" required placeholder="First Name" class="checkout-input">
            </div>
            <div>
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">Last Name *</label>
              <input type="text" id="lname" required placeholder="Last Name" class="checkout-input">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">Email Address</label>
              <input type="email" id="email" placeholder="operator@subzero.supply" class="checkout-input">
            </div>
            <div>
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">Phone / WhatsApp *</label>
              <input type="tel" id="phone" required placeholder="0300 1234567" class="checkout-input">
            </div>
          </div>

          <div>
            <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">Street Address *</label>
            <input type="text" id="address" required placeholder="House No, Street, Sector/Block, Area" class="checkout-input">
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
            <div>
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">City *</label>
              <input type="text" id="city" required placeholder="Lahore" class="checkout-input">
            </div>
            <div>
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">Postal Code</label>
              <input type="text" id="postal" placeholder="54000" class="checkout-input">
            </div>
            <div class="col-span-2 sm:col-span-1">
              <label class="block f-mono text-[11px] uppercase text-[var(--ink-muted)] mb-1">Country</label>
              <input type="text" value="Pakistan" readonly class="checkout-input bg-[var(--bg-subtle)] text-[var(--ink-muted)] cursor-not-allowed">
            </div>
          </div>
        </form>
      </section>

      <!-- 2. PAYMENT METHOD -->
      <section class="bg-[var(--bg-surface)] border border-[var(--border)] p-6 hud-frame">
        <h2 class="f-display text-xl uppercase mb-4 flex items-center gap-2">
          <span class="bg-[var(--ink)] text-[var(--bg-main)] f-mono text-xs px-2 py-0.5">02</span> Payment Method
        </h2>

        <div class="space-y-3">
          <label class="payment-option selected p-4 flex items-center justify-between block" onclick="selectPayment(this)">
            <div class="flex items-center gap-3">
              <input type="radio" name="payment" value="Cash on Delivery (COD)" checked class="accent-[var(--accent)]">
              <div>
                <p class="f-mono text-xs font-bold uppercase">Cash on Delivery (COD)</p>
                <p class="text-[11px] text-[var(--ink-muted)]">Pay in cash upon physical parcel delivery.</p>
              </div>
            </div>
            <i class="fa-solid fa-truck-fast text-[var(--ink-muted)]"></i>
          </label>

          <label class="payment-option p-4 flex items-center justify-between block" onclick="selectPayment(this)">
            <div class="flex items-center gap-3">
              <input type="radio" name="payment" value="JazzCash / EasyPaisa" class="accent-[var(--accent)]">
              <div>
                <p class="f-mono text-xs font-bold uppercase">JazzCash / EasyPaisa</p>
                <p class="text-[11px] text-[var(--ink-muted)]">Direct mobile wallet transfer. Details sent on WhatsApp.</p>
              </div>
            </div>
            <i class="fa-solid fa-mobile-screen-button text-[var(--ink-muted)]"></i>
          </label>
        </div>
      </section>
    </div>

    <!-- RIGHT COLUMN: ORDER MANIFEST -->
    <div class="lg:col-span-5">
      <div class="bg-[var(--bg-surface)] border border-[var(--border-dark)] p-6 hud-frame sticky top-28">
        <h2 class="f-display text-2xl uppercase border-b border-[var(--border)] pb-3 mb-4">Order Manifest</h2>

        <!-- DYNAMIC MANIFEST LIST -->
        <div id="checkout-items-list" class="space-y-3 mb-6 max-h-64 overflow-y-auto pr-1"></div>

        <!-- PRICING BREAKDOWN -->
        <div class="space-y-2 f-mono text-xs text-[var(--ink)] border-t border-b border-[var(--border)] py-4 mb-4">
          <div class="flex justify-between">
            <span class="text-[var(--ink-muted)]">Subtotal</span>
            <span id="subtotal-price">Rs 0.00</span>
          </div>
          <div class="flex justify-between">
            <span class="text-[var(--ink-muted)]">Standard Delivery</span>
            <span class="text-[var(--accent)] font-bold">FREE</span>
          </div>
        </div>

        <!-- TOTAL -->
        <div class="flex justify-between items-baseline mb-6">
          <span class="f-mono text-xs font-bold uppercase">Total Amount</span>
          <span id="total-price" class="f-display text-3xl text-[var(--ink)]">Rs 0.00</span>
        </div>

        <button type="button" onclick="completeOrderViaWhatsApp()" class="w-full btn-buy py-4 px-4 text-xs f-mono font-bold uppercase tracking-widest text-center transition-colors flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-lg"></i> Confirm & Dispatch via WhatsApp
        </button>
      </div>
    </div>
  </div>
</main>

<script>
// UPDATE WITH YOUR WHATSAPP NUMBER (Country Code + Mobile Number, e.g., "923001234567")
const WHATSAPP_NUMBER = "923001234567";

let cart = [];

function loadAndSanitizeCart() {
  try {
    const rawData = localStorage.getItem('subzero_cart');
    if (!rawData) return [];
    
    const parsed = JSON.parse(rawData);
    if (!Array.isArray(parsed)) return [];

    const cleanCart = parsed.filter(item => 
      item && typeof item === 'object' && item.id && item.name && !isNaN(parseFloat(item.price)) && parseInt(item.qty) > 0
    ).map(item => ({
      id: String(item.id),
      name: String(item.name),
      category: String(item.category || 'GEAR'),
      price: parseFloat(item.price),
      icon: String(item.icon || 'fa-box'),
      image: String(item.image || ''), // Retains image path from product.html
      qty: parseInt(item.qty)
    }));

    localStorage.setItem('subzero_cart', JSON.stringify(cleanCart));
    return cleanCart;
  } catch (e) {
    console.error("Cart data corrupted. Clearing storage.");
    localStorage.removeItem('subzero_cart');
    return [];
  }
}

function renderCheckoutManifest() {
  const container = document.getElementById('checkout-items-list');
  const subtotalEl = document.getElementById('subtotal-price');
  const totalEl = document.getElementById('total-price');

  if (cart.length === 0) {
    container.innerHTML = '<div class="text-center py-6 text-[var(--ink-muted)] f-mono text-xs uppercase">Manifest empty. <a href="product.html" class="text-[var(--accent)] underline">Return to armory</a></div>';
    subtotalEl.innerText = 'Rs 0';
    totalEl.innerText = 'Rs 0';
    return;
  }

  let subtotal = 0;
  let html = '';

  cart.forEach(item => {
    const itemTotal = item.price * item.qty;
    subtotal += itemTotal;

    const mediaContainer = item.image 
      ? `<img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">`
      : `<i class="fa-solid ${item.icon}"></i>`;

    html += `
      <div class="flex gap-3 items-center bg-[var(--bg-subtle)] border border-[var(--border)] p-3">
        <div class="w-12 h-12 bg-[var(--bg-main)] border border-[var(--border)] flex items-center justify-center text-xl text-[var(--ink)] overflow-hidden shrink-0">
          ${mediaContainer}
        </div>
        <div class="flex-1 min-w-0">
          <span class="f-mono text-[9px] text-[var(--accent)] font-bold uppercase tracking-widest">${item.category}</span>
          <h4 class="f-display text-sm uppercase truncate">${item.name}</h4>
          <p class="f-mono text-[11px] text-[var(--ink-muted)]">QTY: ${item.qty} × Rs ${item.price.toLocaleString()}</p>
        </div>
        <div class="text-right">
          <span class="f-mono text-xs font-bold">Rs ${itemTotal.toLocaleString()}</span>
        </div>
      </div>`;
  });

  container.innerHTML = html;
  subtotalEl.innerText = `Rs ${subtotal.toLocaleString()}`;
  totalEl.innerText = `Rs ${subtotal.toLocaleString()}`;
}

function selectPayment(element) {
  document.querySelectorAll('.payment-option').forEach(el => {
    el.classList.remove('selected');
    el.querySelector('input[type="radio"]').checked = false;
  });
  element.classList.add('selected');
  element.querySelector('input[type="radio"]').checked = true;
}

function completeOrderViaWhatsApp() {
  const form = document.getElementById('checkout-form');
  
  if (cart.length === 0) {
    alert("Your order manifest is empty!");
    return;
  }

  if (!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  const fname = document.getElementById('fname').value.trim();
  const lname = document.getElementById('lname').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const city = document.getElementById('city').value.trim();
  const postal = document.getElementById('postal').value.trim();
  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

  let itemsText = "";
  let totalSum = 0;

  cart.forEach(item => {
    const lineTotal = item.price * item.qty;
    totalSum += lineTotal;
    itemsText += `• ${item.name} (x${item.qty}) - Rs ${lineTotal.toLocaleString()}\n`;
  });

  const message = `🚨 *NEW SUB-ZERO ORDER MANIFEST*\n\n` +
    `*CUSTOMER DETAILS:*\n` +
    `👤 *Name:* ${fname} ${lname}\n` +
    `📧 *Email:* ${email || 'N/A'}\n` +
    `📞 *Phone:* ${phone}\n` +
    `📍 *Address:* ${address}, ${city}${postal ? ', ' + postal : ''}\n` +
    `💳 *Payment:* ${paymentMethod}\n\n` +
    `*ORDER ITEMS:*\n${itemsText}\n` +
    `💰 *TOTAL AMOUNT:* Rs ${totalSum.toLocaleString()}\n\n` +
    `Please confirm dispatch status.`;

  const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

  // Clear cart upon successful handoff
  localStorage.removeItem('subzero_cart');
  cart = [];
  renderCheckoutManifest();
  window.location.href = waUrl;
}

window.onload = function() {
  cart = loadAndSanitizeCart();
  renderCheckoutManifest();
};
</script>
</body>
</html>
